name: GROMANOF Neon Sandbox
# Trigger fresh sandbox run after repository secret configuration.
on:
  push:
    branches: [feature/neon-sandbox]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/feature/neon-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate scripts
        run: |
          bash -n tools/neon/build-sandbox.sh
          python3 -m py_compile tools/neon/configure_api.py
      - name: Install Android SDK using runner tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Compile sandbox Java
        run: bash gradlew :TMessagesProj_App:compileAfatDebugJavaWithJavac --no-daemon
      - name: Verify dedicated API availability
        env:
          NEON_API_ID: ${{ secrets.NEON_API_ID }}
          NEON_API_HASH: ${{ secrets.NEON_API_HASH }}
        run: |
          if [ -z "$NEON_API_ID" ] || [ -z "$NEON_API_HASH" ]; then
            echo '::warning::Dedicated API missing; no installable APK will be produced.'
          fi
      - name: Prepare dedicated Firebase configuration
        env:
          NEON_GOOGLE_SERVICES_JSON: ${{ secrets.NEON_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          raw = os.environ.get('NEON_GOOGLE_SERVICES_JSON', '')
          if not raw:
              raise SystemExit('Missing Firebase configuration secret')
          data = json.loads(raw)
          assert data['project_info']['project_id'] == 'gromanof-neon', 'Wrong Firebase project'
          assert any(c['client_info']['android_client_info']['package_name'] == 'com.gromanof.neon.beta' for c in data['client']), 'Wrong Firebase package'
          path = Path('TMessagesProj_App/src/debug/google-services.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(raw)
          PY
      - name: Build APK with dedicated API
        env:
          NEON_API_ID: ${{ secrets.NEON_API_ID }}
          NEON_API_HASH: ${{ secrets.NEON_API_HASH }}
        run: |
          if [ -z "$NEON_API_ID" ] || [ -z "$NEON_API_HASH" ]; then
            echo 'Dedicated API not configured.'
            exit 1
          fi
          bash tools/neon/build-sandbox.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gromanof-neon-sandbox
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
